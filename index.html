<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workshops — Equinox Bishopsgate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 36px 24px 20px;
      border-bottom: 1px solid #1e1e1e;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: 4px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .subheading {
      font-size: 9px;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .event-card {
      padding: 20px 24px;
      border-bottom: 1px solid #1a1a1a;
      display: block;
      text-decoration: none;
      transition: background 0.15s ease;
      cursor: pointer;
    }

    .event-card:hover {
      background: #0d0d0d;
    }

    .event-card.sold-out {
      opacity: 0.4;
      pointer-events: none;
      cursor: default;
    }

    .event-date {
      font-size: 9px;
      letter-spacing: 2.5px;
      color: #aaa;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .event-name {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .event-meta {
      font-size: 10px;
      color: #888;
      margin-top: 3px;
    }

    .event-desc {
      font-size: 11px;
      color: #bbb;
      margin-top: 8px;
      line-height: 1.6;
    }

    .event-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }

    .event-spots {
      font-size: 9px;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .event-spots.sold {
      color: #cc4444;
    }

    .rsvp-btn {
      background: #fff;
      color: #000;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 16px;
    }

    .rsvp-btn.disabled {
      background: transparent;
      color: #444;
      border: 1px solid #2a2a2a;
    }

    footer {
      padding: 32px 24px;
      text-align: center;
      font-size: 9px;
      color: #333;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <div class="eyebrow">Equinox Bishopsgate</div>
    <h1>Upcoming<br>Workshops</h1>
    <div class="subheading">Tap an event to reserve your spot</div>
  </header>

  <div id="events-list"></div>

  <footer>Equinox Bishopsgate · Personal Training</footer>

  <script>
    // ─────────────────────────────────────────────
    // EDIT YOUR EVENTS HERE
    // formUrl: paste your Tally form link for each event
    // spotsLeft: set to 0 to mark as Fully Booked
    // ─────────────────────────────────────────────
    const EVENTS = [
      {
        name: "Strength & Mobility",
        date: "Sun 22 Jun · 10:00am",
        duration: "45 min",
        trainer: "Peter V.",
        description: "Build functional strength and improve range of motion for everyday performance.",
        spotsTotal: 12,
        spotsLeft: 8,
        formUrl: "https://tally.so/r/Xx9rGg"
      },
      {
        name: "Nutrition Workshop",
        date: "Wed 25 Jun · 6:30pm",
        duration: "60 min",
        trainer: "Sarah T.",
        description: "Fuelling strategies for performance, recovery, and body composition goals.",
        spotsTotal: 10,
        spotsLeft: 3,
        formUrl: "https://tally.so/r/q4gaOY"
      },
      {
        name: "Running Masterclass",
        date: "Sat 28 Jun · 9:00am",
        duration: "90 min",
        trainer: "James A.",
        description: "Technique, pacing, and programming for distance runners of all levels.",
        spotsTotal: 15,
        spotsLeft: 0,
        formUrl: "https://tally.so/r/Bz6KZ5"
      }
    ];
    // ─────────────────────────────────────────────

    function renderEvents() {
      const container = document.getElementById("events-list");
      container.innerHTML = EVENTS.map((e) => {
        const soldOut = e.spotsLeft === 0;
        return `
          <div class="event-card${soldOut ? " sold-out" : ""}" ${!soldOut ? `onclick="window.open('${e.formUrl}', '_blank')"` : ""}>
            <div class="event-date">${e.date}</div>
            <div class="event-name">${e.name}</div>
            <div class="event-meta">${e.duration} · with ${e.trainer}</div>
            <div class="event-desc">${e.description}</div>
            <div class="event-footer">
              <div class="event-spots${soldOut ? " sold" : ""}">
                ${soldOut ? "Fully booked" : `${e.spotsLeft} / ${e.spotsTotal} spots left`}
              </div>
              <div class="rsvp-btn${soldOut ? " disabled" : ""}">
                ${soldOut ? "Full" : "RSVP →"}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    renderEvents();
  </script>

</body>
</html>
